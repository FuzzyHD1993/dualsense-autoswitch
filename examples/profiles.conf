# Профили DualSense по запущенной игре
# Формат: <glob по имени процесса> | <профиль>
# Регистр не важен. Проверяются comm и имя экзешника из cmdline (wine/Proton).
# Первое совпадение выигрывает. Ничего не совпало -> default.

AlanWake2.exe     | aw2
RDR2.exe          | rdr2
PathOfExile*      | poe2
CrimsonDesert*    | cd
eurotrucks2.exe   | ets2
Cyberpunk2077.exe | cp2077
